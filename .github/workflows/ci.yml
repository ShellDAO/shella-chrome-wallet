name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Node ${{ matrix.node }} · quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout shell-sdk
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ShellDAO/shell-sdk
          path: shell-sdk

      - name: Link sibling shell-sdk
        run: ln -s "$GITHUB_WORKSPACE/shell-sdk" "$GITHUB_WORKSPACE/../shell-sdk"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Pin npm
        run: npm install -g npm@11

      - name: Install shell-sdk dependencies
        working-directory: shell-sdk
        run: npm ci

      - name: Build shell-sdk
        working-directory: shell-sdk
        run: npm run build

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build production bundle
        run: npm run build:prod

      - name: Enforce bundle size
        run: npm run check:bundle-size

      - name: Install Playwright Chromium
        if: matrix.node == 20
        run: npx playwright install --with-deps chromium

      - name: Extension smoke
        if: matrix.node == 20
        run: xvfb-run -a npm run smoke:extension && npm run check:extension-smoke

      - name: TonConnect smoke
        if: matrix.node == 20
        run: xvfb-run -a npm run smoke:tonconnect && npm run check:tonconnect-smoke
